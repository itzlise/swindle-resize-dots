general {
    grace = 1
}

background {
    monitor =
	path = #$HOME/walls/wallhaven-5g22q5.png   # NOTE only png supported for now
    color = rgb(1a1b26)
    blur_size = 5
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    border_size = 2
    border_color = rgb(0db9d7)
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(0db9d7)
    inner_color = rgb(1a1b26)
    font_color = rgb(0db9d7)
    fail_color = rgb(f7768e)
    check_color = rgb(0db9d7)
    fade_on_empty = false
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    font_family = JetBrains Mono Nerd Font Bold 10
    rounding = 0
    
    position = 0, 200
    halign = center
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = rbg(0db9d7)
    font_size = 34
    font_family = JetBrains Mono Nerd Font 10
    font_color = rgb(0db9d7)
    color = rgb(a9b1d6)

    position = 0, -150
    halign = center
    valign = top
}


# Time
label {
    monitor =
    #text = cmd[update:1000] echo "<b><big> $(date +"%I:%M:%S %p") </big></b>" # AM/PM
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>" # 24H
    color = rbg(0db9d7)
    font_size = 94
    font_family = JetBrains Mono Nerd Font 10
    font_color = rgb(0db9d7)
    color = rgb(a9b1d6)

    border_size = 2
    border_color = rgb(000000)
    position = 0, 0
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =$USER
    color = rbg(0db9d7)
    font_size = 18
    font_family = JetBrains Mono Nerd Font 
    font_color = rgb(0db9d7)
    color = rgb(a9b1d6)

    position = 0, 100
    halign = center
    valign = bottom
}


